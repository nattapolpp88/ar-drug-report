<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Interactive Drug Cost Report</title>
  <!-- Three.js + OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <!-- Google Fonts: Sarabun -->
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      color: #fff;
      font-family: 'Sarabun', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0; left: 0;
      z-index: 1;
    }

    /* Top Glass Card */
    .header-card {
      position: absolute;
      top: 15px; left: 15px; right: 15px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 14px 18px;
      z-index: 10;
      box-shadow: 0 8px 32px rgba(0,0,0,0.37);
    }
    .header-title { font-size: 16px; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .header-sub { font-size: 13px; color: #94a3b8; margin-top: 4px; }
    .header-sub b { color: #f8fafc; }

    /* Touch Guide */
    .touch-guide {
      position: absolute;
      bottom: 15px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      color: #94a3b8;
      z-index: 10;
      pointer-events: none;
      white-space: nowrap;
    }

    /* Detail Modal on Tap */
    #detail-card {
      position: absolute;
      bottom: 55px; left: 20px; right: 20px;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(16px);
      border: 1px solid #38bdf8;
      border-radius: 16px;
      padding: 16px;
      z-index: 20;
      display: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      animation: slideUp 0.3s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .drug-badge {
      display: inline-block;
      background: #0284c7;
      color: white;
      font-size: 11px;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
    }
    .drug-name { font-size: 16px; font-weight: bold; color: #ffffff; margin-bottom: 4px; }
    .drug-stats { display: flex; justify-content: space-between; margin-top: 10px; font-size: 13px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px; }
    .stat-val { font-weight: bold; color: #38bdf8; }

    #loading-spinner {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100;
      text-align: center;
      color: #38bdf8;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="loading-spinner">กำลังโหลดข้อมูล 3D Dashboard...</div>

  <!-- Header -->
  <div class="header-card">
    <div class="header-title">📊 รายงานมูลค่าการใช้ยา Top 20</div>
    <div class="header-sub" id="sub-info">กำลังเชื่อมต่อฐานข้อมูล...</div>
  </div>

  <!-- 3D Canvas -->
  <div id="canvas-container"></div>

  <!-- Touch Hint -->
  <div class="touch-guide">👆 หมุนดู 360° | จีบนิ้วซูม | แตะแท่งยาเพื่อดูข้อมูลละเอียด</div>

  <!-- Detail Popup -->
  <div id="detail-card" onclick="this.style.display='none'">
    <span class="drug-badge" id="popup-rank">อันดับ 1</span>
    <div class="drug-name" id="popup-name">ชื่อยา</div>
    <div style="font-size: 13px; color: #cbd5e1;" id="popup-spec">ขนาดความแรง</div>
    <div class="drug-stats">
      <div>มูลค่ารวม: <span class="stat-val" id="popup-cost">0</span> บาท</div>
      <div>จำนวนใช้: <span class="stat-val" id="popup-qty">0</span></div>
    </div>
  </div>

  <script>
    // 🔴 วาง Web App URL จาก Google Apps Script ของคุณที่นี่
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwmIj5s5Ru1KhHIU6M5v6o3GSvpuUyiabUXYMIVsYsTQW6wuoSiIdHCUKppPbsYo4XWAw/exec";

    let scene, camera, renderer, controls;
    let barMeshes = [];
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    // ฟังก์ชันสร้าง Sprite Label แบบคมชัด (ชื่อยา + มูลค่า)
    function createLabelSprite(rank, name, cost) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 512;
      canvas.height = 256;

      // พื้นหลังป้ายแบบโค้งมน (Glass Badge)
      ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      ctx.strokeStyle = rank <= 3 ? '#f59e0b' : '#38bdf8';
      ctx.lineWidth = 8;
      
      ctx.beginPath();
      ctx.roundRect(10, 10, 492, 236, 24);
      ctx.fill();
      ctx.stroke();

      // อันดับ + ชื่อยา (บรรทัดแรก)
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 36px Sarabun, sans-serif';
      ctx.textAlign = 'center';
      const shortName = name.length > 15 ? name.substring(0, 14) + '…' : name;
      ctx.fillText(`#${rank} ${shortName}`, 256, 95);

      // มูลค่า (บรรทัดที่สอง)
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 44px Sarabun, sans-serif';
      const formattedCost = '฿' + Number(cost).toLocaleString();
      ctx.fillText(formattedCost, 256, 175);

      const texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
      const sprite = new THREE.Sprite(spriteMaterial);
      sprite.scale.set(2.4, 1.2, 1);
      return sprite;
    }

    function init3D(dataItems) {
      const container = document.getElementById('canvas-container');
      
      // Scene & Camera
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 15, 22);

      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      // OrbitControls
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI / 2.05;
      controls.target.set(0, 2, 0);

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(10, 25, 15);
      scene.add(dirLight);

      // Grid Floor
      const gridHelper = new THREE.GridHelper(18, 18, 0x38bdf8, 0x1e293b);
      gridHelper.position.y = 0;
      scene.add(gridHelper);

      // สร้างแท่งกราฟ + ป้าย Label 20 รายการ (จัด Grid 5 x 4)
      const maxCost = Math.max(...dataItems.map(d => d.cost));
      const maxHeight = 7.5;
      const cols = 5;
      const spacingX = 2.8;
      const spacingZ = 2.8;
      const offsetX = ((cols - 1) * spacingX) / 2;
      const offsetZ = ((4 - 1) * spacingZ) / 2;

      dataItems.forEach((item, index) => {
        const row = Math.floor(index / cols);
        const col = index % cols;
        const barHeight = maxCost > 0 ? (item.cost / maxCost) * maxHeight : 0.5;

        // สีของแท่ง (Top 3 สีพิเศษ)
        let colorHex = 0x0284c7;
        if (item.rank === 1) colorHex = 0xef4444;
        else if (item.rank === 2) colorHex = 0xf97316;
        else if (item.rank === 3) colorHex = 0xeab308;

        const geometry = new THREE.BoxGeometry(1.4, barHeight, 1.4);
        geometry.translate(0, barHeight / 2, 0);

        const material = new THREE.MeshStandardMaterial({
          color: colorHex,
          roughness: 0.25,
          metalness: 0.35,
          transparent: true,
          opacity: 0.9
        });

        const mesh = new THREE.Mesh(geometry, material);
        const posX = col * spacingX - offsetX;
        const posZ = row * spacingZ - offsetZ;
        mesh.position.set(posX, 0, posZ);
        mesh.userData = item;
        scene.add(mesh);
        barMeshes.push(mesh);

        // ติดป้าย 3D Billboard Label เหนือแท่งกราฟ
        const labelSprite = createLabelSprite(item.rank, item.name, item.cost);
        labelSprite.position.set(posX, barHeight + 0.9, posZ);
        scene.add(labelSprite);
      });

      // Window Resize & Touch Event
      window.addEventListener('resize', onWindowResize);
      renderer.domElement.addEventListener('pointerdown', onPointerDown);

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function onPointerDown(event) {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(barMeshes);

      if (intersects.length > 0) {
        const item = intersects[0].object.userData;
        showDetailCard(item);
      }
    }

    function showDetailCard(item) {
      const card = document.getElementById('detail-card');
      document.getElementById('popup-rank').innerText = `อันดับ ${item.rank}`;
      document.getElementById('popup-name').innerText = item.name;
      document.getElementById('popup-spec').innerText = `ขนาดความแรง: ${item.strength || '-'} | หน่วย: ${item.unit || '-'}`;
      document.getElementById('popup-cost').innerText = Number(item.cost).toLocaleString();
      document.getElementById('popup-qty').innerText = `${Number(item.quantity).toLocaleString()} ${item.unit}`;
      card.style.display = 'block';
    }

    // ดึงข้อมูลจาก GAS
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch(GAS_API_URL, { method: 'GET', redirect: 'follow' });
        const data = await res.json();
        
        document.getElementById('loading-spinner').style.display = 'none';

        if (data.success) {
          document.getElementById('sub-info').innerHTML = 
            `งวดวันที่: <b>${data.date}</b> | รวมมูลค่า: <b>${Number(data.totalCost).toLocaleString()} บาท</b>`;
          init3D(data.items);
        } else {
          alert('ไม่พบข้อมูลจากชีต');
        }
      } catch (err) {
        document.getElementById('loading-spinner').innerText = 'โหลดข้อมูลไม่สำเร็จ ตรวจสอบสิทธิ์ GAS URL';
      }
    });
  </script>
</body>
</html>

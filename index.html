<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>3D AR Top 20 Drug Cost Report</title>
    <!-- A-Frame & AR.js -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      body { margin: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #overlay-ui {
        position: fixed;
        top: 15px; left: 15px; right: 15px;
        background: rgba(15, 23, 42, 0.85);
        color: #ffffff;
        padding: 12px 16px;
        border-radius: 12px;
        backdrop-filter: blur(8px);
        z-index: 9999;
      }
      .title { font-size: 15px; font-weight: bold; color: #38bdf8; }
      .sub-info { font-size: 12px; color: #cbd5e1; margin-top: 4px; }
      #loader {
        position: fixed;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0,0,0,0.8);
        color: #38bdf8;
        padding: 15px 25px;
        border-radius: 8px;
        font-weight: bold;
        z-index: 10000;
      }
    </style>
  </head>
  <body>
    <div id="loader">กำลังดึงข้อมูลคลังยา...</div>

    <div id="overlay-ui" style="display: none;">
      <div class="title">📊 รายงานมูลค่าการใช้ยา Top 20 (AR View)</div>
      <div class="sub-info" id="ui-desc">ส่องกล้องไปที่ HIRO Marker เพื่อดู Hologram 3D</div>
    </div>

    <!-- AR Scene รองรับ iOS Safari 100% -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; facingMode: environment;">
      <a-marker preset="hiro" id="ar-marker">
        <a-entity id="chart-container" position="-1.5 0 1.5" rotation="0 45 0"></a-entity>
        <a-text value="TOP 20 DRUG COST" position="0 2.5 0" align="center" color="#00ffff" scale="1.5 1.5 1.5"></a-text>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // 🔴 นำ Web App URL ที่ได้จาก Google Apps Script มาวางตรงนี้
      const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwmIj5s5Ru1KhHIU6M5v6o3GSvpuUyiabUXYMIVsYsTQW6wuoSiIdHCUKppPbsYo4XWAw/exec";

      window.addEventListener('DOMContentLoaded', async () => {
        try {
          const res = await fetch(GAS_API_URL);
          const data = await res.json();
          renderARData(data);
        } catch (err) {
          document.getElementById('loader').innerText = 'โหลดข้อมูลไม่สำเร็จ ตรวจสอบสิทธิ์ URL';
        }
      });

      function renderARData(response) {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('overlay-ui').style.display = 'block';

        if (!response.success) return;

        document.getElementById('ui-desc').innerHTML = 
          `ประจำงวด: <b>${response.date}</b> | รวมมูลค่า: <b>${Number(response.totalCost).toLocaleString()} ฿</b>`;

        const container = document.getElementById('chart-container');
        const items = response.items;
        const maxCost = Math.max(...items.map(d => d.cost));
        const maxBarHeight = 2.0;
        const cols = 5;

        items.forEach((item, index) => {
          const row = Math.floor(index / cols);
          const col = index % cols;
          
          const barHeight = maxCost > 0 ? (item.cost / maxCost) * maxBarHeight : 0.1;
          const posX = col * 0.6;
          const posZ = -row * 0.6;
          const posY = barHeight / 2;

          const bar = document.createElement('a-box');
          bar.setAttribute('position', `${posX} ${posY} ${posZ}`);
          bar.setAttribute('width', '0.35');
          bar.setAttribute('depth', '0.35');
          bar.setAttribute('height', barHeight);
          
          let color = '#0284c7';
          if (item.rank === 1) color = '#ef4444';
          else if (item.rank === 2) color = '#f97316';
          else if (item.rank === 3) color = '#eab308';
          
          bar.setAttribute('color', color);
          bar.setAttribute('opacity', '0.85');

          const label = document.createElement('a-text');
          label.setAttribute('value', `#${item.rank} ${item.name.substring(0, 8)}\n฿${(item.cost/1000).toFixed(0)}k`);
          label.setAttribute('position', `${posX} ${barHeight + 0.25} ${posZ}`);
          label.setAttribute('align', 'center');
          label.setAttribute('scale', '0.3 0.3 0.3');
          label.setAttribute('color', '#ffffff');

          container.appendChild(bar);
          container.appendChild(label);
        });
      }
    </script>
  </body>
</html>
